name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency: release

env:
  IMAGE: ghcr.io/mateuszmigas/halinka

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Check the tag
        id: release
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag $GITHUB_REF_NAME does not have the form vX.Y.Z."
            exit 1
          fi
          version=$(node -p 'require("./apps/cli/package.json").version')
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::The tag $GITHUB_REF_NAME differs from the version $version of apps/cli/package.json."
            exit 1
          fi
          status=$(curl -sS -o latest.json -w '%{http_code}' https://registry.npmjs.org/halinka/latest)
          case "$status" in
            200)
              latest=$(node -p 'require("./latest.json").version')
              latest_compose=$(node -p 'require("./latest.json").composeVersion ?? ""')
              ;;
            404)
              latest=""
              latest_compose=""
              ;;
            *)
              echo "::error::The npm registry answered $status."
              exit 1
              ;;
          esac
          tags="$IMAGE:$version"
          is_latest=false
          npm_tag=previous
          if [[ "$(printf '%s\n%s\n' "$latest" "$version" | sort --version-sort | tail -n 1)" == "$version" ]]; then
            tags+=",$IMAGE:latest"
            is_latest=true
            npm_tag=latest
          fi
          compose=$(node -p 'require("./apps/cli/package.json").composeVersion')
          is_compose_change=false
          if [[ -n "$latest_compose" && "$latest_compose" != "$compose" ]]; then
            is_compose_change=true
          fi
          {
            echo "version=$version"
            echo "tags=$tags"
            echo "is-latest=$is_latest"
            echo "npm-tag=$npm_tag"
            echo "is-compose-change=$is_compose_change"
          } >> "$GITHUB_OUTPUT"

      - name: Check that the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The commit of $GITHUB_REF_NAME is not on main."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Run unit tests, typescript checks and linting
        run: pnpm validate

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.release.outputs.tags }}
          push: true

      - name: Copy the package from the image
        run: >-
          docker run --rm --platform linux/amd64 --entrypoint cat
          "$IMAGE:${{ steps.release.outputs.version }}" /app/halinka.tgz > halinka.tgz

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_LATEST: ${{ steps.release.outputs.is-latest }}
          IS_COMPOSE_CHANGE: ${{ steps.release.outputs.is-compose-change }}
        run: |
          files=(infrastructure/docker-compose.yml infrastructure/env.template)
          notes=""
          if [[ "$IS_COMPOSE_CHANGE" == true ]]; then
            notes="This release changes docker-compose.yml or env.template. Download them again, and add the new values of env.template to .env."
          fi
          if ! gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --title "$GITHUB_REF_NAME" --notes "$notes" --generate-notes --latest="$IS_LATEST"; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest="$IS_LATEST"
          fi

      - name: Publish to npm
        run: npm publish halinka.tgz --tag "${{ steps.release.outputs.npm-tag }}"
